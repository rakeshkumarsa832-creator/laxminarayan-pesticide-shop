
<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAXMINARAYAN Pesticide Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f1f5f2;color:#222}
header{background:#176b3a;color:white;padding:20px}
main{padding:16px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px}
input,button{padding:12px;margin:5px 0;width:100%;box-sizing:border-box}
button{background:#176b3a;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<header>
<h2>LAXMINARAYAN Pesticide Shop</h2>
<p>Shop Management Software</p>
</header>
<main>
<div class="card">
<h3>Welcome!</h3>
<p>ଦୋକାନ ପରିଚାଳନା ସଫ୍ଟୱେର</p>
<p id="status">Database connection setup pending.</p>
</div>
<div class="card">
<h3>Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="message"></p>
</div>
</main>
<script>
const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){
 const email=document.getElementById("email").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 document.getElementById("message").textContent=
 error ? error.message : "Login successful!";
}
</script>
</body>
</html>
